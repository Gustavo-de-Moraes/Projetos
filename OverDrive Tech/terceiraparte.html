
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Ajuda</title>

    <style>
        .e-help-cta-q4z8nc {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(26, 29, 33, 0.85);
            backdrop-filter: blur(20px);
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
        }

        .e-help-cta__title-q4z8nc {
            margin: 0;
            font-size: 26px;
        }

        .e-help-cta__text-q4z8nc {
            margin: 5px 0 15px;
            color: #cccccc;
            line-height: 1.6;
        }

        .e-help-cta__actions-q4z8nc {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .e-help-button-b3n7wq {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .e-help-button--primary-b3n7wq {
            background: #25D366;
            color: white;
        }

        .e-help-button--primary-b3n7wq:hover {
            background: #1da851;
            transform: translateY(-2px);
        }

        .e-help-button--secondary-b3n7wq {
            background: transparent;
            border: 1px solid #888;
            color: white;
        }

        .e-help-button--secondary-b3n7wq:hover {
            background: #333;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .e-help-cta-q4z8nc {
                padding: 20px;
            }

            .e-help-cta__title-q4z8nc {
                font-size: 22px;
            }

            .e-help-cta__actions-q4z8nc {
                flex-direction: column;
                width: 100%;
            }

            .e-help-button-b3n7wq {
                box-sizing: border-box;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="e-help-cta-q4z8nc">

        <h2 class="e-help-cta__title-q4z8nc">
            Não encontrou o que procurava?
        </h2>

        <p class="e-help-cta__text-q4z8nc">
            Fale direto com nossa equipe, de segunda a sexta,
            das 8h30 às 17h.
        </p>

        <div class="e-help-cta__actions-q4z8nc">

            <a class="e-help-button-b3n7wq e-help-button--primary-b3n7wq"
               href="https://wa.me/5543996359496"
               target="_blank"
               rel="noopener noreferrer">
                Falar no WhatsApp
            </a>

            <a class="e-help-button-b3n7wq e-help-button--secondary-b3n7wq"
               href="mailto:contato@enifler.com.br">
                Enviar e-mail
            </a>

        </div>
    </div>

</body>
</html>
